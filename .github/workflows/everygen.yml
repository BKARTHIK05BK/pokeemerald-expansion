name: everygen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build Kanto ROM
        run: make firered TITLE="EVERYGEN" -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: everygen-kanto
          path: pokefirered.gba

      - name: Run Terastallization tests
        run: |
          cd tools/mgba-rom-test-hydra && make && cd -
          make check BUILD=firered TESTS="(TERA)" -j$(nproc)
